<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%" role="img" aria-label="TalentFlow AI — AI-powered applicant tracking system">
  <defs>
    <linearGradient id="gh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>
    <linearGradient id="gh-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gh-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="gh-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#gh-bg)"/>
  <rect width="1280" height="640" fill="none" stroke="#1F2937" stroke-width="4"/>

  <!-- Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="2">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Left text block -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif">
    <text x="80" y="250" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1">TalentFlow AI</text>
    <text x="80" y="310" font-size="28" font-weight="500" fill="#9CA3AF">Applicant tracking,</text>
    <text x="80" y="350" font-size="28" font-weight="500" fill="#9CA3AF">accelerated by an AI agent.</text>
    <g font-size="18" font-weight="600">
      <rect x="80" y="400" rx="8" ry="8" width="150" height="36" fill="#06B6D4" opacity="0.15"/>
      <text x="98" y="424" fill="#06B6D4">STAR Scorecards</text>
      <rect x="246" y="400" rx="8" ry="8" width="170" height="36" fill="#A855F7" opacity="0.15"/>
      <text x="264" y="424" fill="#A855F7">Human-in-the-loop</text>
      <rect x="432" y="400" rx="8" ry="8" width="150" height="36" fill="#10B981" opacity="0.15"/>
      <text x="450" y="424" fill="#10B981">Hiring Analytics</text>
    </g>
  </g>

  <!-- Right pipeline visual -->
  <g transform="translate(760, 320)">
    <path d="M -40 140 C -40 20, 120 -60, 240 -60 C 360 -60, 520 20, 520 140"
          fill="none" stroke="url(#gh-flow)" stroke-width="16" stroke-linecap="round"/>

    <!-- Source -->
    <circle cx="-40" cy="140" r="48" fill="none" stroke="#06B6D4" stroke-width="4"/>
    <circle cx="-40" cy="140" r="28" fill="#06B6D4"/>

    <!-- AI core -->
    <g filter="url(#gh-glow)">
      <circle cx="240" cy="-60" r="72" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="12 8"/>
      <circle cx="240" cy="-60" r="48" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="6 6"/>
      <circle cx="240" cy="-60" r="34" fill="url(#gh-purple)"/>
    </g>
    <circle cx="240" cy="-60" r="15" fill="#FFFFFF" opacity="0.95"/>

    <!-- Hired -->
    <circle cx="520" cy="140" r="48" fill="none" stroke="#10B981" stroke-width="4"/>
    <circle cx="520" cy="140" r="28" fill="#10B981"/>
    <path d="M 505 140 L 515 150 L 534 128" fill="none" stroke="#FFFFFF" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>