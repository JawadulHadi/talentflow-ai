<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" role="img" aria-label="TalentFlow AI logo (light theme)">
  <defs>
    <linearGradient id="ltl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <linearGradient id="ltl-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="ltl-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Light rounded-square background with soft border -->
  <rect width="400" height="400" rx="88" fill="url(#ltl-bg)" stroke="#E5E7EB" stroke-width="3"/>

  <!-- Subtle grid in gray -->
  <g opacity="0.06" stroke="#111827" stroke-width="2">
    <line x1="120" y1="200" x2="280" y2="200"/>
    <line x1="200" y1="120" x2="200" y2="280"/>
  </g>

  <!-- Pipeline curve (saturated for light bg) -->
  <path d="M 100 270 C 100 180, 150 140, 200 140 C 250 140, 300 180, 300 270"
        fill="none" stroke="url(#ltl-flow)" stroke-width="14" stroke-linecap="round"/>

  <!-- Source node (cyan) -->
  <circle cx="100" cy="270" r="26" fill="none" stroke="#06B6D4" stroke-width="3"/>
  <circle cx="100" cy="270" r="16" fill="#06B6D4"/>

  <!-- AI core (purple) -->
  <circle cx="200" cy="140" r="42" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="200" cy="140" r="22" fill="url(#ltl-purple)"/>
  <circle cx="200" cy="140" r="9" fill="#FFFFFF"/>

  <!-- Hired node (emerald) -->
  <circle cx="300" cy="270" r="26" fill="none" stroke="#10B981" stroke-width="3"/>
  <circle cx="300" cy="270" r="16" fill="#10B981"/>
  <path d="M 291 270 L 297 276 L 309 263" fill="none" stroke="#FFFFFF" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>