<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%" role="img" aria-label="TalentFlow AI banner (light theme)">
  <defs>
    <linearGradient id="rbl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>
    <linearGradient id="rbl-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="20" fill="url(#rbl-bg)" stroke="#E5E7EB" stroke-width="3"/>

  <g opacity="0.05" stroke="#111827" stroke-width="2">
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="900" y1="0" x2="900" y2="220"/>
  </g>

  <!-- Left: brand mark + wordmark -->
  <g transform="translate(40, 60)">
    <path d="M 10 80 C 10 30, 40 10, 70 10 C 100 10, 130 30, 130 80"
          fill="none" stroke="url(#rbl-flow)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="10" cy="80" r="12" fill="none" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="10" cy="80" r="7" fill="#06B6D4"/>
    <circle cx="70" cy="10" r="18" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="70" cy="10" r="10" fill="#A855F7"/>
    <circle cx="130" cy="80" r="12" fill="none" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="130" cy="80" r="7" fill="#10B981"/>

    <text x="170" y="52" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif"
          font-size="40" font-weight="800" fill="#0B0F19" letter-spacing="-0.5">TalentFlow AI</text>
    <text x="170" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif"
          font-size="16" font-weight="500" fill="#6B7280">Applicant tracking, accelerated by an AI agent.</text>
  </g>

  <!-- Right: stage chips (light-optimized) -->
  <g transform="translate(720, 95)" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, sans-serif"
     font-size="13" font-weight="700">
    <g>
      <rect width="90" height="32" rx="16" fill="#06B6D4" opacity="0.12" stroke="#06B6D4" stroke-opacity="0.5"/>
      <text x="16" y="21" fill="#0891B2">Sourced</text>
    </g>
    <g transform="translate(100, 0)">
      <rect width="100" height="32" rx="16" fill="#A855F7" opacity="0.12" stroke="#A855F7" stroke-opacity="0.5"/>
      <text x="14" y="21" fill="#7C3AED">Screened</text>
    </g>
    <g transform="translate(210, 0)">
      <rect width="118" height="32" rx="16" fill="#A855F7" opacity="0.12" stroke="#A855F7" stroke-opacity="0.5"/>
      <text x="12" y="21" fill="#7C3AED">Interviewing</text>
    </g>
    <g transform="translate(338, 0)">
      <rect width="96" height="32" rx="16" fill="#10B981" opacity="0.12" stroke="#10B981" stroke-opacity="0.5"/>
      <text x="16" y="21" fill="#059669">Offer</text>
    </g>
    <g transform="translate(444, 0)">
      <rect width="76" height="32" rx="16" fill="#10B981" opacity="0.18" stroke="#10B981" stroke-opacity="0.7"/>
      <text x="18" y="21" fill="#047857">Hired</text>
    </g>
  </g>
</svg>